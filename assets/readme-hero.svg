  <path d="M275 515 v95" stroke="#242829" stroke-width="3"/>
  <path d="M520 130 v330" stroke="#2f302d" stroke-width="2" opacity=".35"/>
  <circle cx="775" cy="205" r="24" fill="#d39a2f"/>
  <text x="605" y="100" font-family="Georgia,serif" font-size="33" font-style="italic" fill="#35322d">circle of sky</text>
  <text x="605" y="143" font-family="Georgia,serif" font-size="33" font-style="italic" fill="#35322d">three roofs</text>
  <text x="605" y="186" font-family="Georgia,serif" font-size="33" font-style="italic" fill="#35322d">one breath</text>
  <g transform="translate(980,70)"><rect width="280" height="42" fill="#567b7d"/><path d="M30 20 h220" stroke="#d8be78" stroke-width="6" stroke-dasharray="12 10"/><path d="M20 105 Q140 35 260 105 Z" fill="#2c2a27"/><rect x="38" y="145" width="230" height="52" fill="#ae422c"/><rect x="70" y="161" width="160" height="18" fill="#d5a443"/></g>
  <circle cx="1260" cy="335" r="70" fill="#8bb7c4"/>
  <path d="M1260 260 v150" stroke="#2f302d" stroke-width="3"/>
  <circle cx="1260" cy="430" r="5" fill="#2f302d"/><circle cx="1260" cy="455" r="5" fill="#2f302d"/><circle cx="1260" cy="480" r="5" fill="#2f302d"/>
  <text x="930" y="510" font-family="Georgia,serif" font-size="27" font-style="italic" fill="#3a3833">step by step toward the heart of quiet.</text>
  <g stroke="#2f302d" stroke-width="3"><path d="M1325 510 h170"/><path d="M1340 535 h145"/><path d="M1340 560 h145"/><path d="M1340 585 h145"/></g>
  <rect x="0" y="0" width="1600" height="485" filter="url(#grain)" opacity=".8"/>
</g>
<text x="70" y="80" font-family="Helvetica,Arial,sans-serif" font-size="20" letter-spacing="5" fill="#2d2d2a">TREE / SKILL 001</text>
<text x="70" y="122" font-family="Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#2d2d2a">POETIC EDITORIAL COLLAGE</text>
<text x="72" y="158" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#4a4741">Interpret first · translate second · never template the image.</text>
</svg>